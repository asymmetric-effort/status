name: Deploy Status Page

on:
  push:
    branches: [main]
    paths: [status.yaml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: make build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run PDV tests
        run: make pdv
        env:
          BAILFIRE_URL: ${{ steps.deployment.outputs.page_url }}
