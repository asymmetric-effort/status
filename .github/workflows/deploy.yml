name: Deploy Status Page

on:
  push:
    branches: [main]
    paths:
      - data/status.yaml.gpg
      - src/**
      - scripts/**
      - index.html
      - package.json
      - package-lock.json
      - tsconfig.build.json
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Decrypt status.yaml
        run: |
          echo "${{ secrets.STATUS_GPG_PRIVATE_KEY }}" | gpg --batch --import
          gpg --batch --yes --decrypt --output status.yaml data/status.yaml.gpg

      - run: make build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v5

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run PDV tests
        run: make pdv
        env:
          BAILFIRE_URL: ${{ steps.deployment.outputs.page_url }}
