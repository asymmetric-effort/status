name: Deploy Status Page

on:
  push:
    branches: [main]
    paths:
      - status.yaml
      - data/status.yaml.gpg
      - src/**
      - scripts/**
      - index.html
      - package.json
      - package-lock.json
      - tsconfig.build.json
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  packages: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  decrypt:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/asymmetric-effort/status/runner:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Decrypt status.yaml
        run: |
          if [ -f data/status.yaml.gpg ]; then
            echo "${{ secrets.STATUS_GPG_PRIVATE_KEY }}" | gpg --batch --import
            gpg --batch --yes --decrypt --output status.yaml data/status.yaml.gpg
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: decrypted-status
          path: status.yaml
          retention-days: 1

  build-and-deploy:
    needs: decrypt
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/download-artifact@v8
        with:
          name: decrypted-status

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: make build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v5

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run PDV tests
        run: make pdv
        env:
          BAILFIRE_URL: ${{ steps.deployment.outputs.page_url }}
