name: Process Subscribers

on:
  push:
    branches: [main]
    paths:
      - "data/raw/*.gpg"

permissions:
  contents: write

jobs:
  process:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}/runner:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - run: npm ci

      - name: Check GnuPG version
        run: bash scripts/check-gpg.sh

      - name: Import GPG private key
        run: echo "${{ secrets.STATUS_GPG_PRIVATE_KEY }}" | gpg --batch --import

      - name: Validate PQC encryption on raw files
        run: |
          FAILED=0
          for f in data/raw/*.gpg; do
            [ -f "$f" ] || continue
            echo "Validating: $f"
            if ! bash scripts/gpg-validate.sh "$f"; then
              FAILED=1
            fi
          done
          if [ "$FAILED" -eq 1 ]; then
            echo "ERROR: One or more subscriber files failed PQC validation."
            exit 1
          fi

      - name: Process raw subscriber files
        run: node --experimental-strip-types scripts/process-subscribers.ts

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/lists/ data/raw/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: process subscriber additions [skip ci]"
            git push
          fi
