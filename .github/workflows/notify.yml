name: Notify

on:
  push:
    branches: [main]
    paths:
      - status.yaml
      - data/status.yaml.gpg

jobs:
  lint-and-notify:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/asymmetric-effort/status/runner:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - run: npm ci

      - name: Decrypt status.yaml (if encrypted)
        run: |
          if [ -f data/status.yaml.gpg ]; then
            echo "${{ secrets.STATUS_GPG_PRIVATE_KEY }}" | gpg --batch --import
            gpg --batch --yes --decrypt --output status.yaml data/status.yaml.gpg
          fi

      - name: Lint status.yaml
        run: node --experimental-strip-types scripts/lint-status.ts

      - name: Send notifications
        run: node --experimental-strip-types scripts/notify.ts
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          STATUS_PAGE_URL: ${{ secrets.STATUS_PAGE_URL }}
