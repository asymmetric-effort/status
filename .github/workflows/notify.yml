name: Notify

on:
  push:
    branches: [main]
    paths: [status.yaml]

jobs:
  lint-and-notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install GnuPG 2.5.20+ for PQC
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgpg-error-dev libgcrypt-dev libassuan-dev libksba-dev libnpth0-dev
          curl -sL https://gnupg.org/ftp/gcrypt/gnupg/gnupg-2.5.20.tar.bz2 -o /tmp/gnupg.tar.bz2
          cd /tmp && tar xjf gnupg.tar.bz2 && cd gnupg-2.5.20
          ./configure --prefix=/usr/local
          make -j$(nproc)
          sudo make install
          hash -r

      - name: Check GnuPG version
        run: bash scripts/check-gpg.sh

      - name: Lint status.yaml
        run: node --experimental-strip-types scripts/lint-status.ts

      - name: Send notifications
        run: node --experimental-strip-types scripts/notify.ts
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          STATUS_PAGE_URL: ${{ secrets.STATUS_PAGE_URL }}
