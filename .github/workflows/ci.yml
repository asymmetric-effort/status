name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Decrypt status.yaml (if encrypted)
        run: |
          if [ -f data/status.yaml.gpg ]; then
            echo "${{ secrets.STATUS_GPG_PRIVATE_KEY }}" | gpg --batch --import
            gpg --batch --yes --decrypt --output status.yaml data/status.yaml.gpg
          fi

      - run: make lint

      - run: make test

      - run: make build

      - run: make cover
