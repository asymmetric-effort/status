name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/asymmetric-effort/status/runner:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - run: npm ci

      - name: Decrypt status.yaml (if encrypted)
        run: |
          if [ -f data/status.yaml.gpg ]; then
            echo "${{ secrets.STATUS_GPG_PRIVATE_KEY }}" | gpg --batch --import
            gpg --batch --yes --decrypt --output status.yaml data/status.yaml.gpg
          fi

      - run: make lint

      - run: make test

      - run: make build

      - run: make cover
